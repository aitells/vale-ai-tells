# The MDX half of the fixture guard. test-mdx.md is a page whose component
# tags, expressions, and import lines the raw-scope density scripts must
# read past; a tag counted as a sentence start trips SentenceStartRepetition
# on the repeated <Callout> blocks. Those rules ship at warning level, and
# vale exits zero on warnings, so this file raises each to error. It is a
# separate config because vale applies a rule-level override globally
# rather than per section, and the same lines in .vale-test.ini would raise
# the rules over test-false-positives.md too.
#
# The fixture keeps a .md extension on purpose. Vale parses .mdx through
# the external mdx2vast tool, which the pinned toolchain does not carry,
# so a .mdx fixture fails in CI with "mdx2vast not found." The scripts
# under test read the raw text whatever the extension, and the markdown
# parser passes the JSX through as HTML blocks, so the guard is the same.
StylesPath = styles
MinAlertLevel = error

[test-mdx.md]
BasedOnStyles = ai-tells-experimental
ai-tells-experimental.ContentDuplication = error
ai-tells-experimental.ContractionAvoidance = error
ai-tells-experimental.ParagraphLengthVariance = error
ai-tells-experimental.PassiveDensity = error
ai-tells-experimental.SentenceLengthVariance = error
ai-tells-experimental.SentenceStartEntropy = error
ai-tells-experimental.SentenceStartRepetition = error
ai-tells-experimental.TransitionRepetition = error
ai-tells-experimental.TricolonDensityDocument = error
