#:schema https://mise.jdx.dev/schema/mise.json
# Baseline tool pins shared across the tbhb repos. This drop-in is both
# this repository's configuration and the source vendir syncs into every
# consumer's .config/mise/conf.d: repotools dogfoods what it publishes,
# so the shared pins live here rather than in the root mise.toml, which
# holds only repo-specific pins.
#
# mise reads only top-level .config/mise/conf.d/*.toml (never a
# subdirectory), and the root mise.toml overrides any pin here, which is
# what lets a consumer keep a different version without editing a
# vendored file. Tools pinned here lock to the sibling lockfile at
# .config/mise/mise.lock rather than the root mise.lock; each repo
# generates and commits that lockfile itself, because the platform lists
# differ per repo.
#
# These pins are also what the shared tasks under .repotools/tasks run
# against. A task file cannot carry [tools], and a version literal
# inside one would sit outside Renovate's view, so the tasks declare no
# tools of their own and resolve every binary through this table -- or
# through a consumer's deliberate override of it.
#
# Renovate's built-in mise manager matches conf.d drop-ins explicitly and
# derives the datasource from each backend, so no `# renovate:` markers
# are needed on these pins.

[tools]
# actionlint, bats, gitleaks, golangci-lint, and shellcheck ran from
# SHA-pinned container images until the de-containerization pass. The
# images were a digest-pinning mechanism, not an isolation choice, and
# mise.lock now records a digest for every aqua-backed release asset, so
# the tools run as plain pinned binaries.
actionlint = "1.7.12"
bats = "1.14.0"
biome = "2.5.6"
cocogitto = "7.0.0"
cspell = "10.0.1"
# editorconfig-checker builds from source: v3.9.0 publishes no release
# assets, and the aqua package tops out at 3.8.0 and installs the binary
# under its per-platform asset name rather than the name lint-editorconfig
# invokes. Integrity comes from the Go checksum database rather than a
# mise.lock digest. Renovate's go datasource cannot resolve a cmd/
# subpackage path, so the custom manager in .github/renovate.json5 strips
# the suffix for it.
"go:github.com/editorconfig-checker/editorconfig-checker/v3/cmd/editorconfig-checker" = "v3.9.0"
# The secret scanner behind repotools:gitleaks. It reached this drop-in
# a release after its four siblings above: the de-containerization pass
# pinned it in the root mise.toml, which is repo-local, so consumers kept
# running it from ghcr.io/gitleaks/gitleaks until the pin moved here.
gitleaks = "8.30.1"
# go-arch-lint is absent from the aqua registry, so it builds from
# source like editorconfig-checker above. Its main package sits at the
# module root, no cmd/ suffix, so Renovate's built-in mise manager
# resolves this pin through the go datasource without the custom
# suffix-stripping manager.
"go:github.com/fe3dback/go-arch-lint" = "v1.15.0"
# Required by the go: backends above, which compile rather than
# download. Matches the go.mod toolchain directive; go.mod stays the
# authority for module builds, because GOTOOLCHAIN=auto fetches the
# directive's version whenever this pin trails it.
go = "1.26.5"
golangci-lint = "2.12.2"
# cspell ships only as an npm package. Homebrew was installing node too --
# its formula's shebang already pointed at one. The difference is that
# this node is pinned and locked.
node = "24.18.1"
prek = "0.4.11"
rumdl = "0.2.48"
# The YAML gate, replacing yamllint and the last Python-implemented
# linter that checks non-Python files. ryl reimplements all 23 yamllint
# rules in Rust and reads the same .yamllint.yaml, so the config is
# unchanged. It is absent from the mise registry, so the cargo: backend
# is the route and it compiles from source: integrity comes from
# crates.io rather than a mise.lock digest, the same trade the go:
# backends above already accept. Renovate's built-in mise manager
# derives the crate datasource from the backend.
"cargo:ryl" = "0.21.0"
shellcheck = "0.11.0"
tombi = "1.2.5"
vale = "3.17.0"
