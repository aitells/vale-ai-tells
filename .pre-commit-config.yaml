---
default_stages: [pre-commit, pre-push]

# Hooks never touch Vale's synced style packages; that content is
# upstream and not reformatted to match this project's style.
exclude: ^styles/(Google|write-good|proselint)/

repos:
  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        name: Check YAML files with yamllint
        entry: yamllint -c .yamllint.yaml --strict
        types: [yaml]

  - repo: https://github.com/vale-cli/vale
    rev: d32b532e2f5ba703ba06a5a6829f9db1fc78a92c  # frozen: v3.15.2
    hooks:
      # Scope the hook to Markdown, the only file type .vale.ini
      # configures prose rules for. The upstream hook defaults to
      # types: [text], which would hand it the commit-message buffer as
      # well; the commit-msg stage below owns that. The cog-generated
      # CHANGELOG.md is excluded because the [*.md] rule activations
      # still fire on it, the way `just lint-prose` already skips it,
      # and the test-*.md fixtures trip rules on purpose.
      - id: vale
        types_or: [markdown]
        exclude: ^(CHANGELOG\.md|test-.*\.md)$
        # Render findings through the agent template, matching `just lint-prose`.
        args: [--output=ai-tells-agent.tmpl]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 9930066c775a2a82838c0b479cd40a83b3788b75  # frozen: v0.2.45
    hooks:
      - id: rumdl-fmt
      - id: rumdl

  # Shared commit-msg gates. All four run on the commit-msg stage (see the
  # manifest); commitlint and commit-trailers need only bash and git, while
  # vale-commit-msg and cspell-commit-msg lean on this repo's vale/cspell
  # plus the commit-message scope in .vale.ini and .cspell.jsonc. Pinned by
  # SHA with a `# frozen:` tag comment so Renovate's pre-commit manager
  # tracks it, the same as the other hook repos above.
  - repo: https://github.com/tbhb/pre-commit-hooks
    rev: bbb2b8c0b599248dca5c55cf71e75247513f7a84  # frozen: v0.2.0
    hooks:
      - id: commit-trailers
      - id: commitlint
      - id: vale-commit-msg
      - id: cspell-commit-msg

      # The one post-commit hook, and the reason `just prek-install`
      # installs that stage. It deletes the COMMIT_AGENTMSG draft once a
      # commit succeeds, so the next commit starts from an absent path
      # rather than a stale draft.
      - id: clear-commit-agentmsg

  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: biome check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types: [text]
        files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|json5|css|svelte|vue|astro|graphql|gql)$"

      # Tree-wide spell check at pre-commit and pre-push. The commit
      # buffer is handled by cspell-commit-msg above, which resolves this
      # worktree's dictionary rather than the main checkout's.
      - id: cspell
        name: cspell
        entry: cspell --config .cspell.jsonc --no-summary --no-progress --no-must-find-files
        language: system
        stages: [pre-commit, pre-push]
        types: [text]

      # Catches the two ways APM's additive hook merge goes wrong: an
      # ordering its own audit replay never agrees with, and entries for
      # a hook deleted upstream that keep firing. apm.lock.yaml records
      # no hook declarations, so it stays byte-identical across either
      # and is useless as a trigger; watch .apm/ and apm.yml instead.
      - id: apm-audit
        name: apm audit
        entry: just lint-apm
        language: system
        files: ^(\.apm/|apm\.yml$|\.claude/(settings|apm-hooks)\.json$)
        pass_filenames: false

      - id: tombi
        name: tombi (TOML lint + format-check)
        entry: just lint-toml
        language: system
        types: [toml]
        pass_filenames: false

      # just's own formatter, gating the file that defines every other
      # gate. --fmt rewrites whichever justfile just resolves, so the
      # hook passes no filenames and fires on the Justfile alone.
      - id: just-fmt
        name: just --fmt --check
        entry: just lint-just
        language: system
        files: ^Justfile$
        pass_filenames: false

      # editorconfig-checker. Scope lives in .editorconfig-checker.json,
      # and the top-level exclude above already keeps the synced Vale
      # style packages out, so run the recipe unfiltered rather than
      # feeding it the staged paths: the checker walks the git-tracked
      # tree itself and applying its own excludes to that walk is the
      # tested path.
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: just lint-editorconfig
        language: system
        types: [text]
        pass_filenames: false
