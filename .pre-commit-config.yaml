---
default_stages: [pre-commit, pre-push]

# Hooks never touch Vale's synced style packages; that content is
# upstream and not reformatted to match this project's style.
exclude: ^styles/(Google|write-good|proselint)/

# Every hook that runs a project tool goes through `mise run <task>`, so the
# hook and the `mise run` gate execute the same pinned binary. Before this,
# prek built its own environments from its own `rev:` pins: vale ran at
# 3.15.2 here and 3.17.0 through the task runner, so a prose finding could
# appear in one gate and not the other. yamllint and rumdl drifted the same
# way. The mise config is now the only place any of those versions appears,
# and the `repotools:` entries below name tasks the vendored payload
# defines rather than tasks this repo writes.
#
# The tbhb/repotools block below keeps its own `rev:`. Those are the
# shared commit-msg gates rather than tool wrappers, and the consolidation
# owns that pin.

repos:
  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  # Shared commit-msg gates. All four run on the commit-msg stage (see the
  # manifest); commitlint and commit-trailers need only bash and git, while
  # vale-commit-msg and cspell-commit-msg lean on this repo's vale/cspell
  # plus the commit-message scope in .vale.ini and .cspell.jsonc. Pinned by
  # SHA with a `# frozen:` tag comment so Renovate's pre-commit manager
  # tracks it.
  - repo: https://github.com/tbhb/repotools
    rev: 7afd9b223004dca83b415e7871ad63f2a9e1917f  # frozen: v0.8.0
    hooks:
      - id: commit-trailers
      - id: commitlint
      - id: vale-commit-msg
      - id: cspell-commit-msg

      # The one post-commit hook, and the reason `mise run repotools:prek-install`
      # installs that stage. It deletes the COMMIT_AGENTMSG draft once a
      # commit succeeds, so the next commit starts from an absent path
      # rather than a stale draft.
      - id: clear-commit-agentmsg

  - repo: local
    hooks:
      - id: ryl
        name: ryl
        entry: mise run repotools:lint-yaml
        language: system
        types: [yaml]

      # Scope the hook to Markdown, the only file type .vale.ini
      # configures prose rules for. The upstream hook defaulted to
      # types: [text], which would hand it the commit-message buffer as
      # well; the commit-msg stage above owns that. The cog-generated
      # CHANGELOG.md is excluded because the [*.md] rule activations
      # still fire on it, the way `mise run lint-prose` already skips it,
      # and the test-*.md fixtures trip rules on purpose.
      - id: vale
        name: vale
        entry: mise run lint-prose
        language: system
        types_or: [markdown]
        exclude: ^(CHANGELOG\.md|test-.*\.md)$

      - id: rumdl-fmt
        name: rumdl fmt
        entry: mise run repotools:format-markdown
        language: system
        types_or: [markdown]

      - id: rumdl
        name: rumdl check
        entry: mise run repotools:lint-markdown
        language: system
        types_or: [markdown]

      - id: biome-check
        name: biome check
        entry: mise exec -- biome check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types: [text]
        files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|json5|css|svelte|vue|astro|graphql|gql)$"

      # Tree-wide spell check at pre-commit and pre-push. The commit
      # buffer is handled by cspell-commit-msg above, which resolves this
      # worktree's dictionary rather than the main checkout's.
      - id: cspell
        name: cspell
        entry: mise run repotools:lint-spelling
        language: system
        stages: [pre-commit, pre-push]
        types: [text]

      # Catches the two ways APM's additive hook merge goes wrong: an
      # ordering its own audit replay never agrees with, and entries for
      # a hook deleted upstream that keep firing. apm.lock.yaml records
      # no hook declarations, so it stays byte-identical across either
      # and is useless as a trigger; watch .apm/ and apm.yml instead.
      - id: apm-audit
        name: apm audit
        entry: mise run lint-apm
        language: system
        files: ^(\.apm/|apm\.yml$|\.claude/(settings|apm-hooks)\.json$)
        pass_filenames: false

      - id: tombi
        name: tombi (TOML lint + format-check)
        entry: mise run repotools:lint-toml
        language: system
        types: [toml]
        pass_filenames: false

      # The same argument for the mise config, which now defines the
      # toolchain and every gate. mise fmt rewrites the config it
      # resolved, so this passes no filenames either. The conf.d drop-ins
      # are in scope because mise fmt reads them; the vendored task files
      # under .repotools are not -- mise fmt never opens included task
      # files, and tombi is their format gate in the publisher.
      - id: mise-fmt
        name: mise fmt --check
        entry: mise run repotools:lint-mise
        language: system
        files: ^(mise\.toml|\.config/mise/conf\.d/.*\.toml)$
        pass_filenames: false

      # The vendir drift gate: resync and fail on any difference against
      # what git holds, so an edit to a vendored file, a stale sync after
      # a payload bump, or a hand-edited vendir.yml is caught at the
      # commit that introduces it.
      - id: check-vendored
        name: vendir drift check
        entry: mise run repotools:check-vendored
        language: system
        files: ^(vendir\.(yml|lock\.yml)$|\.config/mise/conf\.d/|\.repotools/)
        pass_filenames: false

      # editorconfig-checker. Scope lives in .editorconfig-checker.json,
      # and the top-level exclude above already keeps the synced Vale
      # style packages out, so run the task unfiltered rather than
      # feeding it the staged paths: the checker walks the git-tracked
      # tree itself and applying its own excludes to that walk is the
      # tested path.
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: mise run lint-editorconfig
        language: system
        types: [text]
        pass_filenames: false
