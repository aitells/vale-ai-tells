  - "\\b(?:hold|holds|held|holding|keep|keeps|kept|keeping|leave|leaves|left|leaving|know|knows|knew|knowing|waste|wastes|wasted|wasting|spare|spares|spared|sparing|pull|pulls|pulled|pulling|miss|misses|missed|missing|lose|loses|lost|losing|gain|gains|gained|gaining|shed|sheds|shedding|cast|casts|casting) (?:no (?!(?:one|matter|more|less|fewer|longer|sooner|later|earlier|better|worse|faster|slower|higher|lower|further|deeper|closer|harder|easier)\\b)|zero (?!(?:or|value|values|to)\\b))[a-z][-a-z]*\\b"
