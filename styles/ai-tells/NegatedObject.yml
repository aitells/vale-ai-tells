extends: existence
message: "AI stilted negation: '%s'. Negate the verb with 'doesn't' instead of shifting 'no' onto the object."
level: error
nonword: true
ignorecase: true
# The spec-sheet negation: a transitive verb with "no" moved onto its object
# ("allows no inline suppression," "makes no clock calls," "offers no
# guarantee") where idiomatic prose negates the verb ("doesn't allow inline
# suppression"). The construction is grammatical English, but AI prose reaches
# for it constantly because it sounds like a spec clause; humans write
# "doesn't make network calls." The "zero" spelling is the same move with a
# count for emphasis ("requires zero configuration," "adds zero overhead")
# and shares each token.
#
# The verb list is empirical. Each candidate ran against ~1.3M lines of
# pre-LLM human technical prose (Go stdlib doc comments plus Python stdlib
# source). Verbs where the corpora show the construction is ordinary docs
# English stay out: "has/have no" (807 hits), "contains no" (79), "takes no
# arguments" (50), "returns no value" (18), "finds/found no" (10), "matches
# no" (7), "sees no" (4, mostly the first-person "I see no reason"), and
# "inherits no" (2, the OO docs register: "inherits no __init__"). "Carries no" stays in FigurativeCarries,
# whose content-possession tokens already cover it, and "earns no" in
# FigurativeEarns. The verbs kept below total ~165 corpus
# hits, dominated by "makes no sense" (12) and low-rate docs formulas
# ("requires no locking," "performs no validation," "reports no such
# host," "observe no idle Ps," "copied no bytes"), which are the same
# construction and flag on purpose; add project exceptions where a file
# needs them.
#
# The lookahead after "no" excludes constructions that only share the
# surface: comparatives and quantifier idioms ("no more than," "no better,"
# "fares no better," "starts no earlier than") negate a degree rather than
# an object, and "no one" is a pronoun ("the issues no one filed" is a
# relative clause, not a spec claim). The lookahead after "zero" excludes
# the literal count instead: "zero or more," Go's "zero value," and
# arithmetic ("add zero to the counter"); "adds zero bits" is the one
# surviving corpus hit. A bare relative clause with a listed verb-noun
# still slips through ("a report no manager read"); the corpora show none,
# so the pronoun carve-out is the only gate.
#
# The object may open with a quote mark ("listed no 'every'"), so each
# token allows one before the word. A backticked object needs two forms:
# the literal backtick in the quote class covers plain-text parsing, and
# in markdown the parser masks the code span to one asterisk per
# character, so the asterisk-run alternation is what matches "no `every`"
# there. Vale still reports a match that ends inside the masked span,
# though the column numbers it prints for one fall back to the line. The
# corpora hold quoted objects only after excluded verbs ("contains no
# 'junk'," "means no 'return'"); with the verbs kept here, the quoted,
# backticked, and asterisk shapes all measure zero, and "list" itself
# measures zero in any inflection before "no."
#
# Verbs that take a clausal complement stay out entirely: "means no run
# happened" and "implies no ordering is guaranteed" negate the elided
# clause, not an object, so "mean," "imply," "suggest," and "indicate"
# never enter the list. The corpora put "ensure no" at 16 hits, "check
# no" at 6, "guarantee no" at 3, and "verify no" at 2 in the same
# reading ("ensure no goroutines leak"), so "ensure," "check," "verify,"
# "guarantee," "assert," "confirm," and "promise" stay out with them.
# The caller-side condition frames "pass no arguments" (6) and "specify
# no timeout" (2) keep "pass," "specify," and "supply" out too. Participles and imperatives that read as
# conditions rather than claims stay out of the form lists: "given no
# arguments," "expected no exception," "shown no data," and "assume no
# aliasing" are docs and test language, so "give" keeps only its present
# forms, "expect" and "show" drop their participles, and "assume" keeps
# only "assumes" and "assuming." "Present" drops its bare form, since
# "at present no fix exists" is a time phrase rather than a claim.
