---
extends: existence
message: "AI figurative noun: '%s'. Name the concrete thing it stands for."
level: error
nonword: true
ignorecase: true
# Nominalized figuration: the figure carried by a noun rather than a verb,
# which every Figurative rule in the package anchors on and so never sees.
# A documentation-corpus audit (2026-09) found "reach" as a retrieval path
# ("its primary reach is the whole-token index," "per-rule reach," "picks
# between two reaches"), "wrinkle" as a complication, "story" as a design
# ("the migration story," "a similar story applies"), and "knob" as an
# option, none of them read by any rule. The plain sentence names the
# thing: the index the query consults, the complication, the design, the
# option.
#
# Each token gates on the determiner or compound that makes the noun
# figurative, and each measures at zero to two across the Go and Python
# standard libraries ("Graph pruning adds an extra wrinkle," "the knobs
# for turning on," "A similar story applies to factory functions"), each
# the figure itself. The nominal "reach" costs six, all one RFC 2965
# definition of a host's reach, and the plural "reaches" is admitted only
# at a clause end or before a copula, since "the count reaches 0" is the
# verb. Left uncovered on purpose: "heartbeat" (a distributed-systems
# term), "waterfall" (a process model), "gap" (too ordinary), and "the
# poles" (too rare to gate). Prose about anatomy, textiles, radio, or
# fiction disables the rule.
tokens:
  # --- Reach as a retrieval path ("its primary reach," "per-rule reach,"
  # "the whole reach of the index," "picks between two reaches").
  - "\\b(?:its|their|the|a|per-[a-z]+|whole|primary|secondary|total|full|widest|narrowest) (?:[a-z]+ )?reach\\b(?! (?:for|out|of the (?:hand|arm|child|children|reader|user|law|state|empire))\\b)"
  - "\\b(?:two|three|both|several|multiple|these|those|its|their) (?:[a-z]+ )?reaches\\b(?= ?[.,;:)]| (?:is|are|of|and|or|that|which|were|was)\\b)"

  # --- Wrinkle as a complication ("one wrinkle," "an extra wrinkle,"
  # "the wrinkle is").
  - "\\b(?:a|an|the|one|another|this|that|its|their|each|every|no|first|second|only|last|extra|new|small|minor|major|obvious|real|known) (?:[a-z]+ )?wrinkles?\\b"

  # --- Story as a design ("the migration story," "our testing story," "a
  # similar story applies"). The lookahead keeps fiction and journalism
  # out ("a short story about," "the story behind").
  - "\\b(?:a|an|the|its|their|this|that|our|your|no|each|every|one|another|whole|full|entire|complete|coherent|better|good|bad|weak|strong|similar|same) (?:[a-z-]+ ){1,2}story\\b(?! (?:of|about|behind|from|line|lines|point|points|arc|arcs|mode|book|books|telling|teller|tellers|board|boards|writer|writers|time|hour)\\b)"

  # --- Knob as an option ("a tuning knob," "one more knob," "exposes
  # several knobs").
  - "\\b(?:a|an|the|its|their|this|that|one|each|every|no|another|single|extra|new|tuning|exposed|available|many|several|few|more|two|three|four|five|[a-z]+ing) knobs?\\b"
