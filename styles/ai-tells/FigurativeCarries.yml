---
extends: existence
message: "AI overused verb: '%s'. Name what it contains or entails directly. Disable this rule for freight or logistics prose."
level: error
nonword: true
ignorecase: true
# "Carries" is an AI fingerprint for freighting an abstraction with unstated
# consequence: a term "carries baggage," a change "carries risk," an approach
# "carries a caveat." Literal carrying is everywhere (people carry bags,
# trucks carry freight), so the complement after the verb is the
# discriminator, in the FigurativeSits mold. "Carries its weight" stays in
# AnthropomorphicJustification; the tokens here avoid that span so the two
# rules never double-flag. Freight or logistics writing disables the whole
# rule.
tokens:
  # --- Freighted significance: the abstraction hauls invisible cargo
  # ("carries weight in the review," "carries implications," "the term
  # carries baggage"). "Carries risk" is standard in medical and finance
  # registers; disable the rule for those files.
  - "\\bcarr(?:y|ies|ied|ying) (?:significant |real |extra |added |considerable |serious |enormous |heavy )?(?:weight|significance|meaning|implications?|connotations?|baggage|risks?|consequences|urgency|stigma)\\b"
  - "\\bcarr(?:y|ies|ied|ying) (?:the same|as much|more|less|little|no|equal) weight\\b"

  # --- Attached fine print: the change ships with a warning label
  # ("carries a caveat," "carries a cost," "carries a penalty"). The
  # sibling of the bare grant in AnthropomorphicJustification, which flags
  # what the artifact earns rather than what it lugs around.
  - "\\bcarr(?:y|ies|ied|ying) (?:a|an|the) (?:caveat|warning|cost|price|price tag|penalty|footnote|asterisk|catch|downside|tradeoff|trade-off)\\b"

  # --- Heroics: one component drags the rest across the finish line
  # ("the cache carries the team," "one test carries the suite").
  - "\\bcarr(?:y|ies|ied|ying) the (?:day|team|torch|banner|mantle|load|conversation|narrative|argument|story|suite|whole \\w+)\\b"

  # --- Content possession: an inanimate component treated as a vessel that
  # hauls abstract cargo rather than one that contains or transmits it ("the
  # daemon carries no pipeline logic," "the module carries the validation
  # logic," "the packet carries the payload," "the signal carries data").
  # The transport framing is the tell in either domain, so the code-structure
  # nouns and the networking data nouns are both in the set. The "(?!out\\b)"
  # keeps the phrasal "carries out the logic" (execute) from matching, and
  # the head-noun set excludes physical objects, so literal "carries freight"
  # stays quiet. An optional determiner and one modifier word sit between the
  # verb and the head noun.
  - "\\bcarr(?:y|ies|ied|ying) (?!out\\b)(?:no |a |an |any |little |the |all the |its |their |extra |additional |significant |real |actual |meaningful |core )?(?:[a-z]+ )?(?:logic|functionality|behaviors?|behaviours?|semantics|side[ -]effects?|state|payloads?|data|traffic|tokens?|headers?|cookies?|signals?|metadata|information)\\b"

  # --- Rule possession: a file or section treated as the bearer of a policy
  # rather than the place the policy is written ("the lower block carries the
  # pattern for this case," "the config carries the exemption," "the schema
  # carries the constraint"). Distinct from the content-possession token
  # above, which frames the subject as a vessel hauling data; here the cargo
  # is a rule, and "contains" or "defines" is the word that was avoided. The head
  # nouns are policy and schema terms with no physical sense, so literal
  # freight ("the truck carries the load") cannot reach them. The lookahead
  # excludes both phrasal verbs that would otherwise slip through the
  # modifier slot: "carries out the policy" (execute) and "carried over
  # settings from the previous release" (bring forward).
  #
  # The known false positive is arithmetic writing, where "carry" means the
  # digit propagated to the next column rather than the verb of possession
  # ("carry the constraint" in a solver comment). Numeric and cryptographic
  # prose already disables this rule for the freight tokens above.
  - "\\bcarr(?:y|ies|ied|ying) (?!out\\b|over\\b)(?:no |a |an |any |the |its |their |that |this |the same |every )?(?:[a-z]+ )?(?:pattern|rule|exemption|exception|convention|constraint|requirement|policy|contract|guarantee|invariant|override|precedent|assumption|default|setting)s?\\b"
