---
extends: existence
message: "AI overused verb: '%s'. Name the shortfall or the membership directly. Disable this rule for gravity or weather prose."
level: error
nonword: true
ignorecase: true
# "Falls" is an AI fingerprint for shortcoming, membership, and neglect: a
# result "falls short," a design "falls apart," a case "falls under" a
# category, a task "falls by the wayside." Literal falling is everywhere
# (prices, temperature, night, people, rain), so the complement after the
# verb is the discriminator, in the FigurativeSits mold. Each token curates
# a figurative sense, so "the price fell sharply" and "night falls" stay
# quiet. The past tenses joined after "had fallen behind" walked through
# the present-only tokens; every past form measured zero across the Go and
# Python standard libraries. The one deliberate omission is "fell into
# place," which stays in NarrativePivots so the two rules never
# double-flag.
tokens:
  # --- Shortcoming: the artifact misses the mark or disintegrates ("falls
  # short," "fell flat," "falls apart," "had fallen behind"). "Falls
  # short" can be literal in archery or ballistics; disable the rule
  # there.
  - "\\bf(?:all(?:s|ing)?|ell|allen) short\\b"
  - "\\bf(?:all(?:s|ing)?|ell|allen) flat\\b"
  - "\\bf(?:all(?:s|ing)?|ell|allen) apart\\b"
  - "\\bf(?:all(?:s|ing)?|ell|allen) to pieces\\b"
  - "\\bf(?:all(?:s|ing)?|ell|allen) through(?:\\b|$)"
  - "\\bf(?:all(?:s|ing)?|ell|allen) behind\\b"

  # --- Membership and placement: a case sorted into a bin by falling
  # ("falls under," "fell within scope," "falls outside the remit,"
  # "falls into place," "falls into the trap of"). The grouping-by-cardinal
  # shape ("falls into three categories") stays in CataphoricForecasting.
  - "\\bf(?:all(?:s|ing)?|ell|allen) under (?:the (?:category|heading|umbrella|banner|purview|remit|scope|rubric)|\\w+ jurisdiction)\\b"
  - "\\bf(?:all(?:s|ing)?|ell|allen) (?:squarely |neatly |cleanly |broadly )?(?:within|inside) (?:the )?(?:scope|remit|purview|bounds|category|realm|domain|ambit)\\b"
  - "\\bf(?:all(?:s|ing)?|ell|allen) outside (?:the )?(?:scope|remit|purview|bounds|category|realm|domain)\\b"
  - "\\bfall(?:s|ing)? into place\\b"
  - "\\bf(?:all(?:s|ing)?|ell|allen) into line\\b"
  - "\\bf(?:all(?:s|ing)?|ell|allen) into the (?:trap|habit|pattern|category) of\\b"

  # --- Duty assignment: a burden lands on someone by falling. The curated
  # abstract subject is the gate, so "the ball falls to the floor" and
  # "prices fall to a new low" stay quiet.
  - "\\b(?:responsibility|responsibilities|the task|the job|the duty|the burden|the onus|the decision|the choice|the call|the blame|the work|it all) f(?:alls?|ell) (?:to|on|upon)\\b"

  # --- Neglect: the artifact slips out of care ("falls by the wayside,"
  # "fell through the cracks," "falls on deaf ears," "fell out of favor,"
  # "falls off the radar").
  - "\\bf(?:all(?:s|ing)?|ell|allen) by the wayside\\b"
  - "\\bf(?:all(?:s|ing)?|ell|allen) through the cracks\\b"
  - "\\bf(?:all(?:s|ing)?|ell|allen) on deaf ears\\b"
  - "\\bf(?:all(?:s|ing)?|ell|allen) out of (?:favor|favour|use|fashion|style)\\b"
  - "\\bf(?:all(?:s|ing)?|ell|allen) off (?:the|a) (?:radar|cliff|map|table|rails)\\b"
  - "\\bf(?:all(?:s|ing)?|ell|allen) into (?:disrepair|disuse|obscurity|oblivion|neglect)\\b"

  # --- Prey and capitulation ("falls victim to," "fell prey to," "falls
  # by the sword").
  - "\\bf(?:all(?:s|ing)?|ell|allen) (?:victim|prey) to\\b"
