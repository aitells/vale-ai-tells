---
extends: existence
message: "AI cliché: '%s'. Say what you mean directly."
level: error
ignorecase: true
tokens:
  # "Earning" family
  - earns? its keep
  - earns? its place
  - earns? its spot
  - earned its keep
  - earned its place
  - earned its spot
  - more than earns?
  # Bare grant: the artifact earns a reward beyond its keep ("earns a
  # caveat," "earned the name"). The determiner plus a curated object
  # keeps literal wages out.
  - earn(?:s|ed)? (?:a|an|the) (?:caveat|mention|footnote|call-?out|closer look|second look|spot|place|slot|pass|nod|name|title|label|badge|crown|shout-?out|asterisk|gold star)
  # Typographic and structural grant: the same bare-grant shape, but the
  # reward is a mark on the page or a place in a file rather than notice
  # or rank ("nothing about the word earns a capital," "the file earns
  # that exemption"). Style and documentation writing reaches for this
  # constantly; say who capitalizes it, or that the convention does not
  # apply. The demonstrative and possessive determiners appear here
  # because the shape resists "a" ("earns that exemption," not "earns an
  # exemption"). "Capital" stays gated on a determiner so that the
  # financial sense ("the fund earns capital gains") never reaches the
  # rule; no one earns a hyphen for a day's work, so literal wages stay
  # out on their own.
  - earn(?:s|ed)? (?:a|an|the|that|this|its|no) (?:capital|hyphen|entry|exemption|exception|override|line|section|treatment|designation|distinction|upgrade|promotion)
  # The same grant with a mass noun for a reward, which takes no article
  # ("the term earns italics," "that identifier earns backticks"). None of
  # these has a literal sense a person could be paid in, so the
  # determiner is optional here rather than required.
  - earn(?:s|ed)? (?:no |the |its )?(?:capitalization|capitalisation|italics|boldface|small caps|backticks|quotes|quotation marks)
  # The bare shape with no curated object at all, gated on a determiner and
  # a subject instead ("the change earns a mention", "that rename earns
  # nothing"). Drafted from rejected commit messages and measured at zero
  # matches across the Go and Python standard libraries, which is what lets
  # the object stay open here.
  - (?:a|an|the|this|that|these|those|its|their|both|all)\s+\w+\s+earns?\b
  # Handing: an inanimate subject passes something to another as though
  # across a counter ("the guard hands the merge a clean start"). Same
  # provenance and the same zero measurement.
  - (?:a|an|the|this|that|these|those|its|their|both|all)\s+\w+\s+hands?\s+(?:the|a|it|them)\b

  # Candidate not yet implemented: the occupational metaphor with no
  # possessive anchor. Every idiom in the earning and paying families gates
  # itself on "its" ("earns its keep", "pays its rent"), which is what keeps
  # a person out of the subject slot. "Negates for a living" carries no such
  # anchor, so a bare token would flag "she writes for a living" too, and
  # that is ordinary English about a person with a job.
  #
  # Measured at zero across the Go and Python standard libraries, the
  # markdown in the Go source tree, and this project's accepted commit
  # history. That silence cuts both ways: it leaves the person-subject false
  # positive unmeasured, so the gating problem has to be solved on other
  # evidence before a token lands.

  # "Paying" family
  - pays? for itself
  - pays? dividends
  - pays? its rent
  - more than pays? for itself
  - paid for itself
  - paid dividends
  - paid its rent
  - paying for itself
  - paying dividends
  - paying its rent

  # "Weight" family
  - pulls? its weight
  - carries? its weight
  - carrying its weight
  - pulling its weight
  - punche?s? above its weight
  - punching above its weight
  - worth its weight

  # "Lifting" family
  - does? the heavy lifting
  - does? a lot of heavy lifting
  - doing the heavy lifting
  - doing a lot of heavy lifting
  - does? the legwork
  - doing the legwork
  - do the heavy lifting

  # "Load-bearing" / "doing work" family.
  - load-bearing
  - load bearing
  - does? the work
  - doing the work
  - does? the real work
  - doing the real work
  - does? the actual work
  - doing the actual work
  - does? the hard work
  - doing the hard work
  - does? the important work
  - doing the important work
  - does? most of the work
  - doing most of the work

  # "Standing" family
  - stands? on its own
  - standing on its own
  - holds? its own
  - holding its own
  - speaks? for itself
  - speaking for itself
  - justifies? its existence
  - justify its existence
  - justifying its existence

  # "Deserving" family.
  # Treats abstractions and inanimate subjects as moral agents owed
  # consideration. The gerund shape ("deserves noting", "deserves
  # exploring") is the strongest AI tell — the older idiomatic
  # phrases ("deserves a closer look", "deserves mention") are
  # included for completeness.
  - deserves? attention
  - deserves? mention
  - deserves? mentioning
  - deserves? noting
  - deserves? exploring
  - deserves? unpacking
  - deserves? examining
  - deserves? scrutiny
  - deserves? consideration
  - deserves? careful consideration
  - deserves? careful thought
  - deserves? careful attention
  - deserves? a closer look
  - deserves? a second look
  - deserves? a moment
  - deserves? a mention
  - deserves? credit
  - deserves? confirming
  - deserves? checking
  - deserves? rethinking
  - deserves? revisiting

  # "Crowning" family.
  # Coronation applied to artifacts: a commit "crowns the release," a
  # benchmark win is "the crowning achievement." Royalty and dental
  # prose have the literal senses; disable the rule there.
  - crown(?:s|ed)? (?:a|an|the|its)
  - crowning (?:achievement|glory|jewel|touch|moment)

  # "Claiming" family.
  # The artifact competes for rank ("claims the top spot," "claims
  # pride of place"). Gated on the trophy object, so a paper that
  # claims a result stays clean.
  - claims? (?:the|its|a) (?:top |first |second |third )?(?:spot|place|billing|title|crown|throne|mantle|prize|lead|podium)
  - claims? (?:pride of place|cent(?:er|re) stage)
  - stake(?:s|d)? (?:a|its|out a) claim

  # "Agency" family.
  # Verbs of intention or feeling applied to artifacts: code that
  # "behaves itself," docs that "pretend otherwise," a linter that
  # "cares deeply," a README that "delivers on its promise," a design
  # that "hangs on a single assumption."
  - behaves? itself
  - behaving itself
  - on its best behavior
  - on its best behaviour
  # Reflexive agency: an operation performs a deliberate act on itself
  # ("the query narrows itself," "the config tunes itself"). The
  # self-directed verb is the tell. "Sorts itself out" and "resolves
  # itself" ride along as the idiomatic cousins.
  - (?:narrows?|scopes?|tunes?|optimi[sz]es?|tightens?|rewrites?|configures?|corrects?|prunes?|trims?) itself
  - sorts? itself out
  - resolves? itself
  # Self-report: an artifact vouching for or exposing itself ("the line
  # declares itself," "forgetting that announces itself," "the credential
  # path proves itself"). The plural stays off "versions" because "the
  # versions themselves" is an ordinary emphatic. Measured at zero across
  # the Go and Python standard libraries.
  - (?:declares?|announces?|proves?|reports?) (?:itself|themselves)
  - versions itself
  # Voice: a comparison or a gate that pipes up ("the check only speaks
  # up after the push").
  - speaks? up
  - spoke up
  - pretend(?:s|ed|ing)? otherwise
  - pretend(?:s|ed|ing)? not to
  - cares? deeply
  # Deliberation: a reader or a tool credited with a verdict-in-progress
  # ("the reviewer forms an opinion," "the linter formed its own opinion")
  # where judges or decides names the act. Measured at zero across the Go
  # and Python standard libraries.
  - form(?:s|ed|ing)? (?:an|its own|their own) opinion
  - deliver(?:s|ed|ing)? on (?:its|that|the|every) promise
  - keeps? (?:its|that) promise
  - breaks? (?:its|that) promise
  - hangs? on (?:a single|(?:this |that )?one|whether|every word)
  - hangs? in the balance
  - hinges? (?:on|upon) (?:a single|(?:this |that )?one|whether|the (?:assumption|answer|outcome|question))
  - hinged (?:on|upon) (?:a single|(?:this |that )?one|whether)

  # "Adjudication" family.
  # A fact or metric handed the gavel: "the benchmark decides the
  # debate," "latency puts the matter to rest." State the conclusion
  # and the evidence instead of letting the noun rule on it. The same
  # gavel wielded through "settles" ("availability settles the
  # question," "the reconfirmation settles it") lives in
  # FigurativeSettles with the rest of that verb's figures, and the
  # invoice shapes ("settled the cost," "settles up," "squares the
  # ledger," "balances the books") live in FigurativePays with the
  # other money figures.
  - decides? the (?:question|debate|matter|argument|issue|dispute)
  - decided the (?:question|debate|matter|argument|issue|dispute)
  - puts? the (?:question|debate|matter|argument|issue|dispute) to (?:rest|bed)
  - put the (?:question|debate|matter|argument|issue|dispute) to (?:rest|bed)
  - lays? the (?:question|debate|matter|argument|issue|dispute) to rest
  - laid the (?:question|debate|matter|argument|issue|dispute) to rest

  # "Harm" family.
  # Treats inanimate subjects (a check, a config, a flag) as moral
  # agents capable of inflicting or withholding damage — the
  # Hippocratic register applied to code. "The check passes too
  # without doing harm." Technical writing rarely needs it; just say
  # what the change does or doesn't do.
  # NOTE: legitimate in medical / health-software prose ("the device
  # must do no harm"). No regex-clean way to detect that context;
  # disable this rule for those files via .vale.ini if needed.
  - does? harm
  - doing harm
  - does? no harm
  - doing no harm
  - without doing harm
  - causes? harm
  - causing harm
  - without causing harm

  # "Naming" and "wanting" families, deliberately left uncovered in prose.
  # Both verbs take inanimate subjects the way the families above do, and
  # both were rejected on corpus evidence rather than by omission. Recorded
  # here so a later audit does not reopen either without new data.
  #
  # "Names" as an act of designation reads like a tell ("it names a kind of
  # file", "the field names the target"), but it is ordinary Go and Python
  # documentation style: "IsDir reports whether the path names a directory",
  # "charset names the character set to use", "it names an importable
  # package". Every instance found in the two standard libraries is the
  # precise verb for what an identifier denotes. A commit message is the one
  # place the same phrasing reads as a substitution rather than a definition,
  # so ai-tells-commits does flag it through CommitFigurativeVerbs. The split
  # is deliberate: uncovered here, covered there.
  #
  # "Wants" with an inanimate subject is more entrenched still: "gcc wants
  # to 8-align int64s", "the package wants to make the data available", "the
  # scheduler wants to preempt us". The same libraries reach for it freely
  # with software subjects, and no complement or subject gate separates that
  # register from the AI usage, so a rule here would flood.
