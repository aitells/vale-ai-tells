---
# Secret scanning. gitleaks (from its pinned Docker image, via `just
# gitleaks`) walks the full commit history and the working tree against
# its bundled rule set, so a credential committed anywhere in the repo's
# past fails the gate. Runs on every pull request and push to `main`,
# plus a daily cron that catches rules added to gitleaks after a commit
# merged.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "26 6 * * *"

permissions:
  contents: read

# See ci.yml: without this a pin can move without its lockfile entry.
env:
  MISE_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks scans every commit's diff, not just
          # the checkout tip.
          fetch-depth: 0
          persist-credentials: false

      # gitleaks itself comes from a SHA-pinned image; mise supplies the
      # `just` that invokes it.
      - name: Set up the toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Scan for committed secrets
        run: just gitleaks
