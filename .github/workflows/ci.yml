---
# Main quality gate. This repo's content is a set of Vale styles and the
# docs around them, so the prose, spelling, Markdown, config, TOML, and
# YAML linters are its code gates and run here rather than staying
# local-only. Both jobs install the pinned toolchain through mise and sync
# the Vale styles, then run their gates through `mise run` so mise.toml
# stays the single definition of what each gate runs: the lint job runs the
# full bar via `mise run lint`, and the test job runs the fixture suite via
# `mise run test` (vale must be present to evaluate the fixtures).
# actionlint is absent from the lint bar: the standalone lint-workflows
# workflow already covers it.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A lockfile only binds a version it has already seen. Without this, moving
# a pin in mise.toml and leaving mise.lock alone makes mise fetch the new
# version, compute a fresh digest, and rewrite the lockfile in place -- so a
# Renovate PR that touched only the manifest would go green while the
# committed digests drifted from the pins under review. MISE_LOCKED makes
# that a hard failure instead.
env:
  MISE_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs every tool in mise.toml at the version and digest recorded
      # in mise.lock, replacing the Brewfile and the setup-just and
      # setup-vale composites.
      - name: Set up the toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # mise installs the vale binary but does not fetch the style packages
      # .vale.ini declares.
      - name: Sync Vale styles
        run: mise run install-tools

      - name: Lint
        run: mise run lint

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Sync Vale styles
        run: mise run install-tools

      - name: Test
        run: mise run test
